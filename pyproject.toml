[build-system]
requires = [
  "setuptools>=84.1.0",
  "setuptools-rust>=1.12",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "GameSentenceMiner"
version = "2026.10.1.post1"
description = "A tool for mining sentences from games. Update: Dependencies, replay buffer based line searching, and bug fixes."
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Beangate", email = "bpwhelan95@gmail.com"}
]
urls = { Homepage = "https://github.com/bpwhelan/GameSentenceMiner", Repository = "https://github.com/bpwhelan/GameSentenceMiner" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent"
]
dependencies = [
  "cryptography>=50.0.0,<51",
  "requests>=2.34.2,<2.35.0",
  "watchdog~=6.0.0",
  "soundfile>=0.14.0,<0.15.0",
  "toml~=0.10.2",
  "psutil>=7.2.2,<7.3",
  "python-xlib ; sys_platform == 'linux'",
  "rapidfuzz>=3.14.5,<3.15",
  "plyer~=2.1.0",
  "keyboard~=0.13.5",
  "websockets>=16.1,<16.2.0",
  "dataclasses_json~=0.6.7",
  "obsws-python~=1.8.0",
  "pytz>=2025.1",
  "numpy==2.2.6",
  "faster-whisper~=1.2.1",
  "kaldi-native-fbank>=1.15.0",
  "regex>=2026.7.10,<2026.8.0",
  # windows-capture requires the regular distribution while MeikiOCR requires
  # the headless distribution. Both provide the same cv2 package, so their
  # versions must stay identical or installation order can mix Python files
  # from one release with the native extension from the other.
  "opencv-python==4.13.0.92",
  "opencv-python-headless==4.13.0.92",
  "oneocr==1.0.12",
  "sounddevice~=0.5.2",
  "groq~=0.33.0",
  "flask~=3.1.2",
  "pystray~=0.19.5",
  "pygetwindow==0.0.9; sys_platform == 'win32'",
  "pywin32==312; sys_platform == 'win32'",
  "pillow>=13.0.0,<14",
  "openai>=2.45.0,<2.46",
  "flask-compress~=1.15",
  "meikiocr~=0.3.4",
  "jaconv>=0.5.0,<0.6",
  "loguru~=0.7.3",
  "pyperclipfix>=1.9.4",
  "desktop-notifier>=6.1.0",
  "mss>=10.2.0,<10.3",
  "pyobjc>=12.2.1,<12.3.0 ; sys_platform == 'darwin'",
  # uv 0.12.4 skips these PyObjC dependencies behind platform_release >= '9.0'
  # on modern Darwin releases, while pip check requires them. Keep them explicit
  # until the marker evaluation agrees so CI and managed runtime syncs are complete.
  "pyobjc-framework-CalendarStore>=12.2.1,<12.3.0 ; sys_platform == 'darwin'",
  "pyobjc-framework-Collaboration>=12.2.1,<12.3.0 ; sys_platform == 'darwin'",
  "pyobjc-framework-DictionaryServices>=12.2.1,<12.3.0 ; sys_platform == 'darwin'",
  "pyobjc-framework-InputMethodKit>=12.2.1,<12.3.0 ; sys_platform == 'darwin'",
  "pyobjc-framework-InstantMessage>=12.2.1,<12.3.0 ; sys_platform == 'darwin'",
  "pyobjc-framework-ScriptingBridge>=12.2.1,<12.3.0 ; sys_platform == 'darwin'",
  "pyqt6>=6.11.0,<6.12",
  "pyqtdarktheme~=2.1.0",
  "langid~=1.1.6",
  "pysbd~=0.3.4",
  "pypresence>=4.6.1",
  "tokenizers==0.23.1",
  "curl-cffi>=0.15.0,<0.16",
  "protobuf>=7.35.1",
  "py7zr>=1.1.3,<1.2",
  "waitress==3.0.2",
  "flasgger~=0.9.7",
  "pynput~=1.8.2 ; sys_platform == 'win32'",
  "uv==0.13.4",
  "pip>=26.1.2,<27.0",
  "ollama~=0.6.2",
  "aiohttp==3.14.4",
  "fpng-py-fix~=0.0.3 ; sys_platform == 'win32'",
  "onnxruntime>=1.24.3,<1.25.0",
  "google-genai~=1.70.0",
  "windows-capture>=2.0.0 ; sys_platform == 'win32'",
  "tzlocal>=5.3,<6",
  "send2trash>=1.8.3",
]


[project.optional-dependencies]
lens = [
  "protobuf>=7.35.1",
]

gpu = [
  "onnxruntime-gpu",
  # GPU whisper: CTranslate2 needs cuBLAS + cuDNN at runtime. These used to arrive transitively
  # via torch's CUDA wheel; torch is gone, so the gpu extra pulls them directly (win32 only).
  "nvidia-cublas-cu12==12.9.2.10 ; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.24.0.43 ; sys_platform == 'win32'",
]

dev = [
  "pytest>=9.1.1",
  "hypothesis>=6.156.6",
  "pre-commit>=4.6.0",
  "ruff>=0.15.21",
  "matplotlib~=3.10.9",  # only used by scripts/ocr_metrics_benchmark.py
]

# This creates a command-line script named `gamesentenceminer` that will
# call the `main()` function defined in the package's __main__.py (or wherever
# you've placed your entry function). Adjust the import path as needed.
[project.scripts]
gamesentenceminer = "GameSentenceMiner.gsm:main"

[tool.setuptools.packages.find]
include = ["GameSentenceMiner*"]
# Avoid traversing JavaScript junctions and generated Rust/build trees while
# discovering Python namespaces (in particular with pnpm's linked packages).
exclude = ["node_modules*", "GSM_Overlay*", "texthooker*", "native*", "temp*", "build*", "dist*"]

[tool.setuptools.package-data]
"GameSentenceMiner.web" = ["**/*"]
"GameSentenceMiner" = ["assets/*", "assets/fireredvad/*", "locales/*"]
"GameSentenceMiner.mecab" = ["**/*"]

[[tool.setuptools-rust.ext-modules]]
target = "GameSentenceMiner._native"
path = "native/gsm-native/Cargo.toml"
binding = "PyO3"
py-limited-api = true
# Overlay hot paths need optimized code in editable installs as well as wheels.
debug = false

[tool.uv.sources]
pypresence = { url = "https://github.com/qwertyquerty/pypresence/archive/168c0fc3c00d8b974017cfcd18a4e801b6b78dae.zip" }

[tool.uv]
required-version = "==0.13.4"
# Security floors for indirect dependencies without making them runtime imports.
constraint-dependencies = [
  "anyio>=4.14.2",
  "brotli>=1.2.1",
  "brotlicffi>=1.2.1.0",
  "certifi>=2026.10.19",
  "filelock>=4.2.1",
  "fsspec>=2026.6.0",
  "idna>=3.15",
  "mistune>=3.3.0",
  "multidict>=6.9.1",
  "pyasn1>=0.6.4",
  "setuptools>=84.1.0",
  "urllib3>=2.8.0",
  "virtualenv>=21.14.9",
  "werkzeug>=3.1.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120
force-exclude = true
extend-exclude = [
  "GameSentenceMiner/owocr/owocr/lens_protos/*_pb2.py",
]

[tool.ruff.lint.per-file-ignores]
"GameSentenceMiner/obs/__init__.py" = ["E402", "F401"]
