[workspace]
resolver = "2"
members = [
    "src-tauri",
    "native/gsm-agent",
    "native/gsm-capture",
    "native/gsm-db",
    "native/gsm-dictionary-transfer",
    "native/gsm-downloads",
    "native/gsm-history",
    "native/gsm-intake",
    "native/gsm-mining",
    "native/gsm-overlay",
    "native/gsm-packages",
    "native/gsm-runtime",
    "native/gsm-settings",
    "native/gsm-text-preview",
    "native/gsm-texthook",
    "native/gsm-web",
]
default-members = ["src-tauri"]
exclude = [
    "GSM_Overlay/input_server",
    "native/windows-audio-capture",
    "scripts/OneShotOCR",
    "build",
]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
# Keep OCR and capture optimized for throughput; LTO removes unused code.
opt-level = 3

[profile.release.package.gsm-desktop]
opt-level = "z"

# Keep the frequently edited shell unoptimized for fast dev builds.
# Pixel/OCR loops remain optimized in their engine crates.
[profile.dev.package.gsm-text-preview]
opt-level = 3
[profile.dev.package."fancy-regex:0.17.0"]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.gsm-overlay]
opt-level = 3
[profile.dev.package.gsm-capture]
opt-level = 3
[profile.dev.package.gsm-dictionary-transfer]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.xcap]
opt-level = 3
# Image codecs run on the OCR/preview path even in the development app.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
