[package]
name = "gsm-dictionary-transfer"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
crc32c = "0.6"
leveldb-core = "0.1.2"
num-bigint = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
snap = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
