[package]
name = "gsm-text-preview"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
caseless = "0.2"
indexmap = "2"
rapidfuzz = "0.5"
fancy-regex = "0.17"
gsm-settings = { path = "../gsm-settings" }
regex = "1"
regex-syntax = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
