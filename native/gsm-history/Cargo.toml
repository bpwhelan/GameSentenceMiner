[package]
name = "gsm-history"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
fancy-regex = "0.17"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
