[package]
name = "gsm-settings"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"

[features]
profile-upgrade = ["dep:pep440_rs", "dep:toml"]

[dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
pep440_rs = { version = "0.7", optional = true }
toml = { version = "1.2", default-features = false, features = ["parse", "serde"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "profile_upgrade"
required-features = ["profile-upgrade"]

[[test]]
name = "mining_scopes"
required-features = ["profile-upgrade"]
