[package]
name = "gsm-settings"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"

[dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
