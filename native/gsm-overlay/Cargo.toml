[package]
name = "gsm-overlay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gsm-downloads = { path = "../gsm-downloads" }
anyhow = "1"
base64 = "0.22"
tempfile = "3"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libloading = "0.8"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24", "download-binaries", "copy-dylibs", "tls-native"] }
prost = "0.14"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
fancy-regex = "0.17"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel", "Management_Deployment"] }
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSGeometry"] }
block2 = "0.6"
