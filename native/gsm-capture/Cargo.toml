[package]
name = "gsm-capture"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
xcap = { version = "0.9", features = ["wgc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = { version = "6.1", features = ["image"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }
