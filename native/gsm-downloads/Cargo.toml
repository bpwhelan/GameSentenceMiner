[package]
name = "gsm-downloads"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
publish = false

[dependencies]
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
