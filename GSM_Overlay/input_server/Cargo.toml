[package]
name = "gsm_overlay_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", tag = "v0.6.10" }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rdev = "0.5.3"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "winuser"] }
# Native HID drivers decode Switch/PlayStation reports; DirectInput handles generic devices.
# Bundle and statically link SDL so the packaged helper remains a single executable.
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
gilrs = { version = "0.10", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
