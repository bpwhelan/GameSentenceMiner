[package]
name = "gsm_overlay_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"

gilrs = { version = "0.10", default-features = false, features = ["xinput"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs.git", tag = "v0.6.10" }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rdev = "0.5.3"

# Safe Rust bindings for the hoshidicts Yomitan-dictionary engine. Pinned to an
# immutable commit rather than a mutable branch/tag; the crate carries and builds
# its own hoshidicts C++ engine submodule, so GSM no longer vendors the engine or
# hand-writes the FFI/CMake glue. GPL-3.0-or-later, matching this workspace.
#
# Pinned at 9c69654: the smallest verified rev that points the crate's nested
# engine submodule back at Manhhao/hoshidicts@86c6e2f (UPSTREAM), carrying only
# GSM's typed lookup-options C API on top of the upstream engine. This trusts
# Manhhao's upstream ownership: GSM no longer depends on the fork's
# MAX_KANJI_RESULT_ENTRIES engine guard (the kanji-result cap is enforced on
# GSM's own consumer side) and no longer relies on the fork-only .hoshidicts_4
# marker. The upstream engine reads/writes the .hoshidicts_3 marker, so freshly
# imported dictionaries use .hoshidicts_3 and GSM's validator no longer accepts
# a stale .hoshidicts_4-only directory the engine could not read.
hoshidicts = { git = "https://github.com/bee-san/hoshidicts-rs.git", rev = "9c69654a8f4ab583f33825c2cb8e55d1f2a3345e" }
