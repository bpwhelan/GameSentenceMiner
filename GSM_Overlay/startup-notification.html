<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSM Overlay Ready</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .startup-notification {
      padding: 28px 42px;
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      color: #00ff88;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      animation: fade-out 3s ease-out 100ms forwards;
    }

    @keyframes fade-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="startup-notification">GSM Overlay Loaded &amp; Ready!</div>
</body>
</html>
