[build]
jobs = 6

[cache]
# Automatically garbage-collect unused crate downloads and git checkouts in CARGO_HOME.
auto-clean-frequency = "7 days"

[profile.dev]
# Tests inherit this profile. Keep source locations for backtraces and avoid
# retaining incremental state for each feature set, test binary and toolchain.
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
# Strip debug info from third-party dependencies to drastically shrink target/
# and .pdb sizes while keeping line tables for local crates.
debug = false

[env]
# sdl2-sys bundles SDL 2.26, whose CMake minimum predates CMake 4's policy floor.
# This also applies when building the input server with --manifest-path here.
CMAKE_POLICY_VERSION_MINIMUM = { value = "3.5", force = false }
