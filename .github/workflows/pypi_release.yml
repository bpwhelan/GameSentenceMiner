name: Build and Publish Python Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      post_release:
        description: "Post-release number (for example, 1 publishes .post1); leave blank for the base version"
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.package_meta.outputs.package_version }}
      should_publish: ${{ steps.check_version.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve package version
        id: package_meta
        env:
          POST_RELEASE: ${{ inputs.post_release }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)["project"]
          version = project["version"]
          post_release = os.environ.get("POST_RELEASE", "").strip()
          if post_release:
              if not re.fullmatch(r"[1-9]\d*", post_release):
                  raise SystemExit("post_release must be a positive integer")
              base_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
              if not re.fullmatch(r"\d+(?:\.\d+)+", base_version):
                  raise SystemExit(f"Electron version {base_version!r} is not a stable numeric version")
              version = f"{base_version}.post{post_release}"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package_version={version}\n")
          print(f"Package: {project['name']} {version}")
          PY

      - name: Check if version exists on PyPI
        id: check_version
        env:
          PACKAGE_VERSION: ${{ steps.package_meta.outputs.package_version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          package_name = "GameSentenceMiner"
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{package_name}/{version}/json"
          should_publish = "true"
          try:
              with urllib.request.urlopen(url, timeout=30):
                  should_publish = "false"
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  print(f"Unexpected PyPI response {exc.code}; attempting publish")
          except Exception as exc:
              print(f"Version check failed ({exc}); attempting publish")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_publish={should_publish}\n")
          PY

  build-wheels:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cibw_build: cp310-win_amd64
          - os: ubuntu-latest
            cibw_build: cp310-manylinux_x86_64
          - os: macos-15
            cibw_build: cp310-macosx_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply package version
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(\[project\][\s\S]*?\nversion\s*=\s*)"[^"]*"',
              rf'\g<1>"{os.environ["PACKAGE_VERSION"]}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update package version")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Install wheel builder
        run: python -m pip install --upgrade cibuildwheel

      - name: Build stable-ABI wheel
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          # Keep auditwheel's manylinux relabeling for PyPI, but do not follow
          # the legacy MeCab dependency which is already bundled in the wheel.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --exclude libmecab.so.1 -w {dest_dir} {wheel}"
          # delocate likewise follows obsolete dependencies embedded in the
          # legacy MeCab binaries carried for other platforms.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
          CIBW_BEFORE_BUILD_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Smoke test stable backend wheel
        run: node scripts/smoke-test-wheel.mjs wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply package version
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(\[project\][\s\S]*?\nversion\s*=\s*)"[^"]*"',
              rf'\g<1>"{os.environ["PACKAGE_VERSION"]}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update package version")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: sdist/*.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-wheels
      - build-sdist
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload dist/*

  report-skipped:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publish skipped because version ${{ needs.prepare.outputs.package_version }} already exists on PyPI."
