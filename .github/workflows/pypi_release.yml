name: Build and Publish Python Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      post_release:
        description: "Post-release number (for example, 1 publishes .post1); leave blank for the base version"
        required: false
        type: string

jobs:
  build-and-publish-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip requests

      - name: Apply post-release version
        if: github.event_name == 'workflow_dispatch' && inputs.post_release != ''
        env:
          POST_RELEASE: ${{ inputs.post_release }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          post_release = os.environ["POST_RELEASE"].strip()
          if not re.fullmatch(r"[1-9]\d*", post_release):
              raise SystemExit("post_release must be a positive integer")

          base_version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          if not re.fullmatch(r"\d+(?:\.\d+)+", base_version):
              raise SystemExit(
                  f"Electron version {base_version!r} is not a stable numeric version"
              )

          pyproject_path = Path("pyproject.toml")
          pyproject = pyproject_path.read_text(encoding="utf-8")
          version_pattern = re.compile(
              r'(\[project\][\s\S]*?\nversion\s*=\s*)"[^"]*"'
          )
          post_version = f"{base_version}.post{post_release}"
          updated, replacements = version_pattern.subn(
              rf'\g<1>"{post_version}"',
              pyproject,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not update [project] version in pyproject.toml")
          pyproject_path.write_text(updated, encoding="utf-8")
          print(f"Publishing Python-only post release {post_version}")
          PY

      - name: Read package metadata from pyproject.toml
        id: package_meta
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          package_name = project["name"]
          package_version = project["version"]

          print(f"Package: {package_name}")
          print(f"Version: {package_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"package_name={package_name}\n")
              out.write(f"package_version={package_version}\n")
          PY

      - name: Check if version exists on PyPI
        id: check_version
        run: |
          python - <<'PY'
          import os
          import requests

          package_name = "${{ steps.package_meta.outputs.package_name }}"
          version = "${{ steps.package_meta.outputs.package_version }}"
          url = f"https://pypi.org/pypi/{package_name}/{version}/json"

          print(f"Checking Package: {package_name}")
          print(f"Checking Version: {version}")
          print(f"Checking URL: {url}")

          should_publish = "true"

          try:
              response = requests.get(url, timeout=30)
              if response.status_code == 404:
                  print(f"Version {version} not found on PyPI. Proceeding.")
              elif response.status_code == 200:
                  print(f"Version {version} already exists on PyPI. Skipping publish.")
                  should_publish = "false"
              else:
                  print(f"Unexpected PyPI response: {response.status_code}")
                  print("Proceeding with publish attempt.")
          except Exception as exc:
              print(f"Version check failed: {exc}")
              print("Proceeding with publish attempt.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_publish={should_publish}\n")
          PY

      - name: Install build and publish dependencies
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          python -m pip install --upgrade setuptools wheel twine build

      - name: Build the package
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          python -m build

      - name: Publish package to PyPI
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*

      - name: Report skipped publish
        if: steps.check_version.outputs.should_publish == 'false'
        run: |
          echo "Publish skipped because version ${{ steps.package_meta.outputs.package_version }} already exists on PyPI."
