name: Desktop development checks

on:
  pull_request:
    paths: &desktop_paths
      - 'Cargo.*'
      - '.cargo/**'
      - 'src-tauri/**'
      - 'native/**'
      - 'electron-src/**'
      - 'GSM_Overlay/**'
      - 'assets/**'
      - 'resources/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vitest.config.*'
      - '.github/actions/**'
      - '.github/workflows/*desktop*.yml'
  push:
    branches: [main]
    paths: *desktop_paths
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Renderer and shared checks
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select native checks
        id: scope
        shell: bash
        run: |
          # For a PR, HEAD is GitHub's trial merge and its first parent is the base.
          # Shared types, build scripts, assets and native changes exercise the full desktop.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
             git diff --quiet HEAD^1 HEAD -- . ':(exclude)electron-src/renderer/**' ':(exclude)docs/**' ':(exclude)*.md'; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/desktop-frontend

  native:
    needs: frontend
    if: needs.frontend.outputs.native == 'true'
    uses: ./.github/workflows/desktop_verify.yml
    with:
      smoke: true
