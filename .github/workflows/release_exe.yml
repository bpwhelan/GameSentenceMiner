name: Release native desktop

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Replace the assets of an existing coordinated release
        type: boolean
        default: false

concurrency:
  group: native-stable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/native_desktop.yml
    with:
      publish: true
      force_rebuild: ${{ inputs.force_rebuild }}
    secrets: inherit
