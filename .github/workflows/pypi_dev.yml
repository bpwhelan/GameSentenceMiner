name: Build and Publish Python Prerelease

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.package_meta.outputs.package_version }}
      should_publish: ${{ steps.check_version.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read package metadata
        id: package_meta
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              project = tomllib.load(stream)["project"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package_version={project['version']}\n")
          print(f"Package: {project['name']} {project['version']}")
          PY

      - name: Check prerelease version on PyPI
        id: check_version
        env:
          PACKAGE_VERSION: ${{ steps.package_meta.outputs.package_version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          should_publish = "false"
          if "dev" in version or "rc" in version:
              should_publish = "true"
              url = f"https://pypi.org/pypi/GameSentenceMiner/{version}/json"
              try:
                  with urllib.request.urlopen(url, timeout=30):
                      should_publish = "false"
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      print(f"Unexpected PyPI response {exc.code}; attempting publish")
              except Exception as exc:
                  print(f"Version check failed ({exc}); attempting publish")
          else:
              print(f"Version {version} is not a dev or rc version; skipping publish")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"should_publish={should_publish}\n")
          PY

  build-wheels:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wheel builder
        run: python -m pip install --upgrade cibuildwheel

      - name: Build stable-ABI wheel
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_BEFORE_BUILD_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$PATH:$HOME/.cargo/bin"'
          CIBW_TEST_COMMAND: 'python -c "from GameSentenceMiner import _native; assert _native.api_version() == 1"'
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-prerelease-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-prerelease-sdist
          path: sdist/*.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-wheels
      - build-sdist
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-prerelease-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload dist/*

  report-skipped:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publish skipped for version ${{ needs.prepare.outputs.package_version }}."
