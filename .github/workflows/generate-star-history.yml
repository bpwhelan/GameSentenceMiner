name: Generate Star History

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/generate-star-history.yml
    schedule:
        - cron: '0 0 * * 0'
    workflow_dispatch:

jobs:
    star-history:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.STARS_WRITE_TOKEN }}

            - name: Generate star history
              uses: kitswas/generate-star-history@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  output-path: assets/star-history.svg

            - name: Commit chart
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add assets/star-history.svg
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "chore: update star history chart [skip ci]"
                    git push
                  fi
