name: Release native desktop preview

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/native_desktop.yml
    with:
      publish: true
      prerelease: true
    secrets: inherit
