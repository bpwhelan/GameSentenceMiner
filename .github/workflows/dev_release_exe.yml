name: Build portable Tauri preview ZIPs

on:
  workflow_dispatch:

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # GitHub validates the called workflow's publish job permission even for an
  # artifact-only run. The build job declares contents: read.
  contents: write
  actions: read
  id-token: write

jobs:
  preview:
    uses: ./.github/workflows/native_desktop.yml
    with:
      portable_preview: true
      prerelease: true
      publish: false
