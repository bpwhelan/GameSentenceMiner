name: Publish Tauri desktop preview

on:
  workflow_dispatch:
    inputs:
      portable_only:
        description: Build portable test ZIPs as workflow artifacts only
        type: boolean
        default: false

concurrency:
  # Preview version numbers come from repository-wide tags, across branches.
  group: native-preview
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  preview:
    uses: ./.github/workflows/native_desktop.yml
    with:
      portable_preview: ${{ inputs.portable_only }}
      prerelease: true
      publish: ${{ !inputs.portable_only }}
    secrets: inherit
