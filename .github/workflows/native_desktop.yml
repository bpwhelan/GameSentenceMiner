name: Native desktop on all platforms

on:
  pull_request:
    paths:
      - 'desktop-runtime/**'
      - 'src-tauri/**'
      - 'native/gsm-overlay/**'
      - 'native/gsm-texthook/**'
      - 'native/gsm-agent/**'
      - 'native/gsm-runtime/**'
      - 'native/gsm-intake/**'
      - 'native/gsm-mining/**'
      - 'native/gsm-settings/**'
      - 'native/gsm-text-preview/**'
      - 'native/gsm-db/**'
      - 'native/gsm-web/**'
      - 'GameSentenceMiner/web/templates/**'
      - 'GameSentenceMiner/web/static/**'
      - 'native/gsm-history/**'
      - 'native/gsm-packages/**'
      - 'native/gsm-downloads/**'
      - 'native/gsm-native/src/**'
      - 'GameSentenceMiner/assets/vocr/**'
      - 'electron-src/**'
      - 'GSM_Overlay/**'
      - 'scripts/*native*'
      - 'scripts/publish-download-assets.mjs'
      - 'package*.json'
      - '.github/workflows/*desktop*'
  workflow_dispatch:
  workflow_call:
    inputs:
      electron_beta:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false
      portable_preview:
        type: boolean
        default: false
      force_rebuild:
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Check updater signing is configured before starting the matrix
        if: inputs.publish
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::Set TAURI_SIGNING_PRIVATE_KEY to the key matching src-tauri/tauri.conf.json."
            exit 1
          fi
      - id: version
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          ELECTRON_BETA: ${{ inputs.electron_beta }}
          PORTABLE_PREVIEW: ${{ inputs.portable_preview }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PORTABLE_PREVIEW" = true ] && [ "$PUBLISH" = true ]; then
            echo "Portable preview ZIPs are distributed through CI artifacts."
            exit 1
          fi
          if [ "$ELECTRON_BETA" = true ]; then
            if [ "$PRERELEASE" != true ] || [ "$PUBLISH" != true ] || [ "$PORTABLE_PREVIEW" = true ]; then
              echo "::error::An Electron beta requires a published desktop prerelease."
              exit 1
            fi
            version=$(node scripts/compute-version.cjs --pre-release --preid beta --after-published)
          elif [ "$PRERELEASE" = true ] && [ "$PORTABLE_PREVIEW" != true ]; then
            version=$(node scripts/compute-version.cjs --pre-release --preid preview --after-published)
          elif [ "$PRERELEASE" = true ]; then
            version=$(node scripts/compute-version.cjs --pre-release --preid beta)
          else
            version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GSM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      CARGO_INCREMENTAL: '0'
      # Keep the four platform dependency caches within the repository storage limit.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/native-dev
      # ort-sys 2.0.0-rc.12 locates the DLL destination using Cargo's old OUT_DIR layout.
      __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: ${{ matrix.platform == 'win32-x64' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          cache-on-failure: true
          cache-bin: false
          # The input server has its own lockfile. Listing the shared target twice would prune it twice.
          workspaces: |
            . -> src-tauri/target/native-dev
            GSM_Overlay/input_server -> target
            native/gsm-native -> target
      - name: Record Rust cache restore
        shell: bash
        env:
          EXACT_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          echo "Rust dependency cache for \`${{ matrix.platform }}\`: exact match = \`$EXACT_HIT\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Set up the tested Windows WebView2 runtime
        if: runner.os == 'Windows' && !inputs.portable_preview
        shell: pwsh
        run: |
          # The runner image's 157.0.4341.46 can hang during extension worker startup.
          # Use the same fixed runtime for the debug and packaged smoke tests.
          $version = '158.0.4370.33'
          $package = "Microsoft.WebView2.FixedVersionRuntime.$version.x64"
          $source = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/ecc2761e-1380-46ee-9552-995b039e4e47/$package.cab"
          $cab = Join-Path $env:RUNNER_TEMP "$package.cab"
          $destination = Join-Path $env:RUNNER_TEMP 'gsm-test-webview2'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          curl.exe --fail --silent --show-error --location --retry 3 --output $cab $source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $cab).Hash -ne '835DA387DF67797F710881F553BB6934D98F24D08E370456F48D38ED4E072B62') {
            throw "WebView2 $version download failed SHA-256 verification"
          }
          expand.exe $cab '-F:*' $destination | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $cab
          $runtime = Join-Path $destination $package
          $exe = Get-Item -LiteralPath (Join-Path $runtime 'msedgewebview2.exe')
          if ($exe.VersionInfo.ProductVersion -ne $version) { throw 'Unexpected WebView2 binary version' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$runtime" >> $env:GITHUB_ENV
          "Windows smoke tests use WebView2 $version." >> $env:GITHUB_STEP_SUMMARY
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libgbm-dev libpipewire-0.3-dev libclang-dev libudev-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-shape0-dev libnspr4 libnss3 libasound2-dev patchelf xvfb openbox libfuse2
      - name: Install ONNX Runtime for Intel macOS
        if: matrix.platform == 'darwin-x64'
        run: |
          # ort-sys no longer ships an Intel Mac build. Use the pinned CPU build
          # distributed by Handy for the same ONNX Runtime ABI (1.24.2).
          ort_dir="$RUNNER_TEMP/gsm-onnxruntime"
          mkdir -p "$ort_dir"
          curl --fail --silent --show-error --location --retry 3 -o "$ort_dir/runtime.tgz" \
            https://blob.handy.computer/onnxruntime-osx-x86_64-1.24.2.tgz
          echo "590cee05699047b85e4a8115b4cec792073c2972ce78de383356a552a296a9c4  $ort_dir/runtime.tgz" | shasum -a 256 -c
          tar -xzf "$ort_dir/runtime.tgz" -C "$ort_dir" --strip-components 2 \
            onnxruntime-osx-x86_64-1.24.2/lib/libonnxruntime.1.24.2.dylib
          ln -s libonnxruntime.1.24.2.dylib "$ort_dir/libonnxruntime.dylib"
          curl --fail --silent --show-error --location --retry 3 -o "$ort_dir/licenses.zip" \
            https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.24.2/microsoft.ml.onnxruntime.1.24.2.nupkg
          echo "782564d3d68e87269ea1812cc94710ad06fe014faf093f01a6f89d0bd58719d3  $ort_dir/licenses.zip" | shasum -a 256 -c
          unzip -q "$ort_dir/licenses.zip" LICENSE ThirdPartyNotices.txt -d "$ort_dir"
          {
            echo "ORT_LIB_PATH=$ort_dir"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "GSM_MACOS_ORT_DIR=$ort_dir"
          } >> "$GITHUB_ENV"
      - name: Set the coordinated release version
        run: node scripts/set-native-ci-version.mjs
      - name: Install development dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the desktop and native input service
        if: ${{ !inputs.portable_preview }}
        run: npm run build:tauri
      - name: Check shared services and reader behavior
        if: ${{ !inputs.portable_preview }}
        shell: bash
        run: |
          if [ -n "$GSM_MACOS_ORT_DIR" ]; then export DYLD_LIBRARY_PATH="$GSM_MACOS_ORT_DIR"; fi
          npm run test:ts -- --maxWorkers=2 electron-src/renderer/ electron-src/shared/ release_build_contract.test.ts vocr_package.test.ts
          node --test scripts/hachidori-integration.test.mjs scripts/sync-hachidori.test.mjs GSM_Overlay/tests/hachidori_engine_host.test.cjs GSM_Overlay/tests/native_dictionary_transport.test.cjs GSM_Overlay/tests/text_hover.test.cjs
          node --test scripts/build-native.test.mjs scripts/native-package-policy.test.mjs scripts/package-agent-runtime.test.mjs scripts/native-paths.test.mjs scripts/package-native-portable.test.mjs
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target/native-dev
          cargo test --locked --manifest-path native/gsm-overlay/Cargo.toml
          cargo test --locked --manifest-path native/gsm-texthook/Cargo.toml
          cargo test --locked --manifest-path native/gsm-agent/Cargo.toml
          cargo test --locked --manifest-path native/gsm-runtime/Cargo.toml
          cargo test --locked --manifest-path native/gsm-intake/Cargo.toml
          cargo test --locked --manifest-path native/gsm-mining/Cargo.toml
          cargo test --locked --manifest-path native/gsm-settings/Cargo.toml
          cargo test --locked --manifest-path native/gsm-text-preview/Cargo.toml
          cargo test --locked --manifest-path native/gsm-web/Cargo.toml
          cargo test --locked --manifest-path native/gsm-db/Cargo.toml
          cargo test --locked --manifest-path native/gsm-history/Cargo.toml
          # The native preview no longer installs the retired interpreter environment.
          cargo test --locked --manifest-path native/gsm-packages/Cargo.toml -- --skip python::tests::
          cargo test --locked --manifest-path native/gsm-downloads/Cargo.toml
      - name: Exercise the native runtime bus and desktop bridge
        if: runner.os != 'Linux' && !inputs.portable_preview
        shell: bash
        run: |
          if [ -n "$GSM_MACOS_ORT_DIR" ]; then export DYLD_LIBRARY_PATH="$GSM_MACOS_ORT_DIR"; fi
          node scripts/test-native-desktop.mjs runtime
          node scripts/test-native-desktop.mjs foundation
      - name: Exercise native windows, dictionaries, transfer, Home and overlay
        if: runner.os != 'Linux' && !inputs.portable_preview
        shell: bash
        run: |
          if [ -n "$GSM_MACOS_ORT_DIR" ]; then export DYLD_LIBRARY_PATH="$GSM_MACOS_ORT_DIR"; fi
          node scripts/check-native-desktop.mjs
      - name: Exercise Linux webviews under a window manager
        if: runner.os == 'Linux' && !inputs.portable_preview
        run: bash scripts/test-native-linux.sh all
        env:
          GSM_NATIVE_TEST_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/native-dev/debug/gsm-desktop
      - name: Build preview resources and check packaging contracts
        if: inputs.portable_preview
        shell: bash
        run: |
          npm run build
          npm run build:input-server
          npm run test:ts -- --maxWorkers=2 electron-src/main/release_build_contract.test.ts electron-src/main/prerelease_build_contract.test.ts
          node --test scripts/build-native.test.mjs scripts/native-package-policy.test.mjs scripts/package-agent-runtime.test.mjs scripts/native-paths.test.mjs scripts/package-native-portable.test.mjs
      - name: Record prerelease metadata
        if: inputs.prerelease
        run: |
          node scripts/write-prerelease-metadata.mjs --desktop-only --version "${{ needs.version.outputs.version }}"
      - name: Stage the complete native application
        shell: bash
        run: |
          npm run build:windows-helpers
          npm run stage:native -- ${{ inputs.portable_preview && '--portable-preview' || '' }}
          node scripts/verify-native-package.mjs
      - name: Build bundles for testing or Windows release code signing
        if: ${{ !inputs.portable_preview && (!inputs.publish || (runner.os == 'Windows' && !inputs.prerelease)) }}
        run: node scripts/build-native-desktop.mjs
      - name: Build signed update bundles
        if: inputs.publish && (runner.os != 'Windows' || inputs.prerelease)
        run: node scripts/build-native-desktop.mjs --signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify isolated Windows release resources
        if: runner.os == 'Windows' && !inputs.portable_preview
        run: node scripts/test-native-package.mjs
      - name: Build and package the portable preview
        if: inputs.portable_preview
        shell: bash
        run: |
          node scripts/build-native-desktop.mjs --portable-preview
          if [ -n "$GSM_MACOS_ORT_DIR" ]; then
            app="$CARGO_TARGET_DIR/release/bundle/macos/GSM Preview.app/Contents"
            test -f "$app/Frameworks/libonnxruntime.1.24.2.dylib"
            test -f "$app/Resources/onnxruntime/ThirdPartyNotices.txt"
            otool -L "$app/MacOS/gsm-desktop" | grep -F '@rpath/libonnxruntime.1.24.2.dylib'
            otool -l "$app/MacOS/gsm-desktop" | grep -F 'path @executable_path/../Frameworks (offset'
          fi
          node scripts/package-native-preview.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.portable_preview
        with:
          name: GSM-Preview-${{ matrix.platform }}
          path: dist/native-preview/*.zip
          if-no-files-found: error
      - name: Collect installers and portable builds
        if: ${{ !inputs.portable_preview }}
        run: node scripts/collect-native-assets.mjs
      - name: Upload Windows installer for code signing
        id: windows-installer
        if: inputs.publish && !inputs.prerelease && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-unsigned-installer
          path: dist/native-release/win32-x64/*Setup*.exe
          if-no-files-found: error
      - name: Sign the Windows installer
        if: inputs.publish && !inputs.prerelease && runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd
        with:
          api-token: ${{ secrets.SIGNPATH_APITOKEN }}
          organization-id: c677c167-9f3e-4577-b967-5d7730bf742d
          project-slug: GameSentenceMiner
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/native-release/win32-x64
      - name: Upload Windows portable files for code signing
        id: windows-portable
        if: inputs.publish && !inputs.prerelease && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-unsigned-portable
          path: build/native-desktop/portable
          if-no-files-found: error
      - name: Sign the Windows portable application
        if: inputs.publish && !inputs.prerelease && runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd
        with:
          api-token: ${{ secrets.SIGNPATH_APITOKEN }}
          organization-id: c677c167-9f3e-4577-b967-5d7730bf742d
          project-slug: GameSentenceMiner
          signing-policy-slug: release-signing
          artifact-configuration-slug: Unpacked_GSM
          github-artifact-id: ${{ steps.windows-portable.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/native-signed-portable
      - name: Package signed portable files and sign the final updater bytes
        if: inputs.publish && !inputs.prerelease && runner.os == 'Windows'
        run: |
          node scripts/package-native-portable.mjs dist/native-signed-portable "dist/native-release/win32-x64/GameSentenceMiner-${{ needs.version.outputs.version }}-win-unpacked.zip"
          node scripts/sign-native-assets.mjs dist/native-release/win32-x64
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install the shipping Electron client for the release update test
        if: inputs.publish && (!inputs.prerelease || inputs.electron_beta) && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows-handoff-test/prepare.ps1 -TargetVersion $env:GSM_RELEASE_VERSION -InstallerPath "dist/native-release/win32-x64/GameSentenceMiner-Setup-$env:GSM_RELEASE_VERSION.exe"
      - name: Upgrade Electron using the final signed Windows installer
        if: inputs.publish && (!inputs.prerelease || inputs.electron_beta) && runner.os == 'Windows'
        run: node scripts/windows-handoff-test/exercise.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.portable_preview }}
        with:
          name: native-release-${{ matrix.platform }}
          path: dist/native-release/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    # Inherit the caller's token. Requesting write here also rejects read-only
    # build workflows at validation time, even when this job is skipped.
    if: inputs.publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          path: dist/native-release
      - name: Require a complete, consistently signed four-platform release
        run: node scripts/merge-native-updates.mjs
      - name: Publish on-demand assets and mirror signed update downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_STORAGE: ${{ secrets.R2_STORAGE }}
        run: |
          if [ -n "$R2_STORAGE" ]; then
            sudo apt-get update
            sudo apt-get install -y rclone
          fi
          node scripts/publish-download-assets.mjs --publish --release-dir dist/native-release
      - name: Prepare release notes and in-app changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          mode=stable
          if [ "$PRERELEASE" = true ]; then mode=prerelease; fi
          node scripts/render-release-body.mjs --mode "$mode" --version "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" > dist/native-release/release-notes.md
          node scripts/export-changelog-release-asset.mjs --version "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --out "dist/native-release/changelog-v${RELEASE_VERSION}.json"
      - name: Publish only after every platform succeeds
        run: node scripts/publish-native-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          GSM_RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          GSM_RELEASE_FORCE: ${{ inputs.force_rebuild }}
