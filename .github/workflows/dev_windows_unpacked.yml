name: Build native desktop previews
run-name: Build native desktop previews

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Package to build
        type: choice
        default: all
        options: [all, win32-x64, linux-x64, darwin-arm64, darwin-x64]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/native_desktop.yml
    with:
      prerelease: true
      platform: ${{ inputs.platform }}
