name: Build and check the desktop renderer
description: Produce the common web resources consumed by every native runner.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22.23.1'
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - name: Verify the checked-in themes before the build regenerates them
      run: npm run sync:theme -- --check
      shell: bash
    - run: npm run build
      shell: bash
    - name: Check renderer, shared code and packaging contracts
      shell: bash
      run: |
        npm run test:ts -- --maxWorkers=3
        node --test scripts/hachidori-integration.test.mjs scripts/sync-hachidori.test.mjs GSM_Overlay/tests/hachidori_engine_host.test.cjs GSM_Overlay/tests/native_dictionary_transport.test.cjs GSM_Overlay/tests/text_hover.test.cjs
        node --test scripts/native-package-policy.test.mjs scripts/package-agent-runtime.test.mjs scripts/native-paths.test.mjs scripts/package-native-portable.test.mjs
    - uses: actions/upload-artifact@v4
      with:
        name: desktop-web-resources
        path: |
          dist/renderer/
          GSM_Overlay/settings/app-theme.css
          resources/assets/qt_themes.json
        if-no-files-found: error
        retention-days: 2
        overwrite: true
