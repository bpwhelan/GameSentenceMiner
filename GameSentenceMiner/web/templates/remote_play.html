<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Remote Play · GameSentenceMiner</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/remote-play.css') }}">
</head>
<body>
    <main class="remote-shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="GameSentenceMiner home">
                <span class="brand-mark" aria-hidden="true">G</span>
                <span>GameSentenceMiner</span>
            </a>
            <div class="connection-summary">
                <span id="connectionDot" class="status-dot" aria-hidden="true"></span>
                <span id="connectionLabel">Disconnected</span>
            </div>
            <div class="topbar-actions">
                <button id="fullscreenButton" class="icon-button" type="button" title="Fullscreen" aria-label="Fullscreen">
                    <span aria-hidden="true">⛶</span>
                </button>
                <button id="disconnectButton" class="text-button" type="button" disabled>Disconnect</button>
            </div>
        </header>

        <section class="stream-workspace" aria-label="Remote game stream">
            <div id="videoStage" class="video-stage" tabindex="0">
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="ocrOverlay" class="ocr-overlay" aria-label="OCR text regions"></div>

                <div id="emptyState" class="empty-state">
                    <div class="empty-signal" aria-hidden="true"><span></span><span></span><span></span></div>
                    <h1>OBS Remote Play</h1>
                    <p>Stream the active OBS program view, control your game, and click text to look it up. Remote input starts automatically.</p>
                    <button id="connectButton" class="primary-button" type="button">Connect to stream</button>
                </div>

                <div id="streamNotice" class="stream-notice" role="status" aria-live="polite" hidden></div>
            </div>
        </section>

        <div class="media-controls" aria-label="Stream settings">
            <label for="qualitySelect">Quality</label>
            <select id="qualitySelect" title="Disconnect to change quality. Bitrate adapts to your connection.">
                <option value="balanced">Balanced · up to 4 Mbps</option>
                <option value="high" selected>High · up to 8 Mbps</option>
                <option value="ultra">Ultra · up to 16 Mbps</option>
            </select>
            <button id="audioButton" class="text-button" type="button" disabled>Mute</button>
            <span id="audioStatus" role="status">Game audio disconnected</span>
            <span id="streamStats" aria-label="Received stream quality"></span>
        </div>
        <footer class="control-dock">
            <div class="control-copy">
                <strong id="inputTitle">Remote input is off</strong>
                <span id="inputDescription">Video and OCR lookup are available without controlling the game.</span>
            </div>
            <label class="switch-control">
                <input id="inputToggle" type="checkbox" disabled>
                <span class="switch-track" aria-hidden="true"><span></span></span>
                <span>Enable input</span>
            </label>
        </footer>
    </main>

    <dialog id="lookupDialog" class="lookup-dialog">
        <div class="dialog-heading">
            <h2 id="lookupHeading">Lookup</h2>
            <button id="closeLookupDialog" class="icon-button" type="button" aria-label="Close" title="Close">×</button>
        </div>
        <div id="lookupContent" class="lookup-content"></div>
    </dialog>

    <script src="{{ url_for('static', filename='js/remote-play.js') }}" defer></script>
</body>
</html>
