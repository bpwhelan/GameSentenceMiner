<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="../../../../GSM_Overlay/hoshidicts_popup.css">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #202329;
      }

      body.light {
        background: #eef1f4;
      }
    </style>
  </head>
  <body>
    <script>
      const path = require("node:path");
      const {
        HoshiDictsPopup,
      } = require(path.resolve(process.cwd(), "GSM_Overlay/hoshidicts_popup.js"));

      const dictionaryId = "11111111-1111-4111-8111-111111111111";
      const secondDictionaryId = "22222222-2222-4222-8222-222222222222";
      const png =
        "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAMCAMAAABcOc2zAAAAD1BMVEXY7fMPdm4WenKaxcL+/v5DJWccAAAAN0lEQVQI12NgwACMYABjYBNgYmZhZoIzgDQzCwsLMyOMAaRZQACkGsyAqwACmAoMMwhbiyGABgBh/wDrQhaHYAAAAABJRU5ErkJggg==";
      let popup = null;

      function glossary(id, content) {
        return Object.freeze({
          id,
          content,
          definitionTags: Object.freeze([]),
          termTags: Object.freeze([]),
        });
      }

      function dictionary(id, title, glossaries, options = {}) {
        return Object.freeze({
          id: `group-${id}`,
          dictionaryId: id,
          title,
          displayTitle: title,
          glossaries: Object.freeze(glossaries),
          frequencies: Object.freeze(options.frequencies || []),
          pitches: Object.freeze(options.pitches || []),
        });
      }

      function entry(id, expression, reading, dictionaries) {
        return Object.freeze({
          id,
          rank: 0,
          expression,
          reading,
          matched: expression,
          deinflected: expression,
          deinflectionReason: "",
          partOfSpeech: Object.freeze(["noun"]),
          dictionaries: Object.freeze(dictionaries),
        });
      }

      function resultModel(entries, generation = 1) {
        return Object.freeze({
          catalogGeneration: 1,
          requestGeneration: generation,
          matchedLength: 1,
          nativeElapsedMs: 2,
          entries: Object.freeze(entries),
        });
      }

      function scenarioModel(name) {
        const plain = dictionary(
          dictionaryId,
          "GSM Fixture",
          [glossary("plain", "cat; a small domesticated feline")],
          {
            frequencies: [{ value: 100, displayValue: "100" }],
            pitches: [1],
          },
        );
        if (name === "long") {
          return resultModel([
            entry("long", "取り扱う", "とりあつかう", [
              dictionary(
                dictionaryId,
                "Long Dictionary",
                Array.from({ length: 14 }, (_, index) =>
                  glossary(
                    `long-${index}`,
                    `Definition ${index + 1}: ${"Detailed dictionary content ".repeat(5)}`,
                  ),
                ),
              ),
            ]),
          ]);
        }
        if (name === "multiple") {
          return resultModel([
            entry("multiple", "走る", "はしる", [
              dictionary(dictionaryId, "Primary Dictionary", [
                glossary("run-1", "to run"),
              ]),
              dictionary(secondDictionaryId, "Frequency and Usage", [
                glossary("run-2", "to travel quickly on foot"),
              ], {
                frequencies: [{ value: 350, displayValue: "350" }],
                pitches: [2],
              }),
            ]),
          ]);
        }
        if (name === "media") {
          return resultModel([
            entry("media", "図", "ず", [
              dictionary(dictionaryId, "Illustrated Dictionary", [
                glossary(
                  "image",
                  JSON.stringify({
                    type: "structured-content",
                    content: [
                      { tag: "span", content: "diagram" },
                      {
                        tag: "img",
                        path: "media/picture.png",
                        title: "Dictionary diagram",
                        width: 180,
                        height: 120,
                      },
                    ],
                  }),
                ),
              ]),
            ]),
          ]);
        }
        return resultModel([entry("short", "猫", "ねこ", [plain])]);
      }

      window.renderScenario = async function renderScenario(name, options = {}) {
        popup?.destroy();
        document.body.className = options.theme === "light" ? "light" : "";
        popup = new HoshiDictsPopup({
          document,
          window,
          resolveMedia: async () => ({
            dataUrl: png,
            mimeType: "image/png",
          }),
          getWorkArea: () => ({
            x: 0,
            y: 0,
            width: window.innerWidth,
            height: window.innerHeight,
          }),
        });
        const anchor = options.edge
          ? { x: window.innerWidth - 12, y: window.innerHeight - 12, height: 10 }
          : { x: 42, y: 46, height: 22 };
        const started = performance.now();
        if (name === "empty") {
          popup.showState("empty", { generation: 1, anchor });
        } else if (name === "error") {
          popup.showState("error", {
            generation: 1,
            anchor,
            errorCode: "LOOKUP_FAILED",
          });
        } else {
          popup.showResults(scenarioModel(name), {
            generation: 1,
            anchor,
            sourceSentence: "Visual fixture sentence.",
          });
        }
        await Promise.resolve();
        const images = Array.from(
          document.querySelectorAll("#hoshidicts-popup-root img"),
        );
        await Promise.all(images.map((image) => image.decode()));
        await new Promise((resolve) =>
          requestAnimationFrame(() => requestAnimationFrame(resolve)),
        );
        const root = document.getElementById("hoshidicts-popup-root");
        const rect = root.getBoundingClientRect();
        return {
          name,
          paintMs: performance.now() - started,
          textLength: root.textContent.trim().length,
          rect: {
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
          },
          viewport: {
            width: window.innerWidth,
            height: window.innerHeight,
          },
          imageCount: images.length,
          visibleImageCount: images.filter((image) => {
            const imageRect = image.getBoundingClientRect();
            return (
              image.complete &&
              image.naturalWidth > 0 &&
              imageRect.width >= 32 &&
              imageRect.height >= 32
            );
          }).length,
        };
      };
    </script>
  </body>
</html>
